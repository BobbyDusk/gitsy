<html>

<head>
  <title>Gitsy Settings</title>
  <script src="scripts/api.js"></script>
  <script src="scripts/app.js" defer></script>
  <style>
    html,
    body {
      font-size: 14px;
    }

    main {
      width: 350px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    h1,
    p {
      margin: 0;
    }

    #gitsy-api-validation {
      font-size: 12px;
      margin-top: 3px;
      text-align: right;
    }
  </style>
</head>

<body style="height: fit-content;">
  <main>
    <h1>Gitsy</h1>
    <div>
      <label for="gitsy-api-key" style="font-weight: bold;">Github API Token</label>
      <textarea id="gitsy-api-key" style="width: 100%;" name="gitsy-api-key" rows="4"
        placeholder="Your Github API Token"></textarea>
        <p id="gitsy-api-validation"></p>
    </div>
    <p>For instructions, check out the <a target="_blank" href="https://github.com/BobbyDusk/gitsy">GitHub
        repository</a>.</p>
    <p>If you're experiencing issues, please open an issue on the <a target="_blank" href="https://github.com/BobbyDusk/gitsy/issues">GitHub issues page</a> or send an email to <a href="mailto:info@edgeofdusk.com?subject=Issue with Gitsy">info@edgeofdusk.com</a>.</p>
  </main>
</body>

</html>
